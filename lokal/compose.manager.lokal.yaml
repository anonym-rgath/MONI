# Override für eine lokale Testumgebung mit Docker Desktop (macOS/Windows), nur zum Ausprobieren.
# Nutzung: siehe lokal/README.md. Produktiv immer nur compose.manager.yaml verwenden.
services:
  moni-manager:
    volumes: !override
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Docker Desktop kennt keine rslave-Propagation; ohne sie sieht der Manager nur das Root-Dateisystem der Docker-VM.
      - /:/host/root:ro
      - /etc/hostname:/host/etc/hostname:ro
      - moni-manager-data:/data
    networks:
      - default
      - socket-proxy
      - moni-lokal

networks:
  moni-lokal:
    external: true
