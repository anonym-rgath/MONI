# CI-Pipeline fuer MONI
# ---------------------
# Validiert jeden Push auf main und jeden Pull Request (inkl. Dependabot):
#   1. Backend-Unit-Tests.
#   2. Baut beide Image-Targets (agent, manager). Damit laufen `yarn build`
#      und `pip install` durch.
#   3. Startet compose.agent.yaml (Agent + Socket-Proxy) auf dem Runner und
#      prueft Health, Auth, Snapshot, Metriken und die Container-Haertung.
#   4. Startet compose.manager.yaml und prueft Health, Admin-Token, lokalen
#      Server mit Verlauf, Geheimnis-freie Logs und die Container-Haertung.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
        working-directory: backend

  build:
    name: Build images & smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          load: true
          tags: moni-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Build manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: manager
          load: true
          tags: moni-manager:ci
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager

      - name: Agent smoke test
        run: |
          set -euo pipefail
          docker compose -f compose.agent.yaml up -d --build
          ok=0
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9810/api/v1/health | grep -q '"ok"' && { ok=1; break; }; sleep 1; done
          [ "$ok" = 1 ] || { echo "FAIL: /api/v1/health nicht erreichbar"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9810/api/v1/snapshot)" = 401
          TOKEN=$(docker compose -f compose.agent.yaml exec -T moni-agent python -m moni.cli token create --name ci | tail -n1)
          sleep 20   # mindestens eine Messung abwarten (Takt 15 s)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:9810/api/v1/snapshot > snap.json
          python3 -c "import json; s=json.load(open('snap.json')); assert s['docker']['reachable'], s['warnings']; assert s['host']['filesystems'], 'keine Dateisysteme'; print('OK', len(s['containers']), 'Container')"
          # Erst in Dateien schreiben: grep -q in einer Pipe kann unter pipefail per SIGPIPE falsch auswerten
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:9810/metrics > metrics.txt
          grep -q '^moni_docker_up 1' metrics.txt
          test "$(docker inspect --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' $(docker compose -f compose.agent.yaml ps -q moni-agent))" = "app true [ALL]"
          # Token darf nie im Log stehen (`!` allein würde set -e umgehen)
          docker compose -f compose.agent.yaml logs > smoke.log
          if grep -qF "$TOKEN" smoke.log; then echo "FAIL: Token im Log"; exit 1; fi

      - name: Manager smoke test
        env:
          COMPOSE_PROJECT_NAME: moni-manager
        run: |
          set -euo pipefail
          MONI_SECRET_KEY=$(docker run --rm moni-manager:ci python -m moni.cli secret generate)
          export MONI_SECRET_KEY
          docker compose -f compose.manager.yaml up -d --build
          ok=0
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/v1/health > health.json 2>/dev/null && grep -q '"ok"' health.json && { ok=1; break; }; sleep 1; done
          [ "$ok" = 1 ] || { echo "FAIL: Manager /api/v1/health nicht erreichbar"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/servers)" = 401
          TOKEN=$(docker compose -f compose.manager.yaml exec -T moni-manager python -m moni.cli token create --name ci --scope admin | tail -n1)
          sleep 35   # mindestens zwei Messungen abwarten (Takt 15 s)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8080/api/v1/servers > servers.json
          python3 -c "import json; s=[x for x in json.load(open('servers.json')) if x['is_local']]; assert len(s)==1 and s[0]['status']=='ok', s; open('local_id','w').write(str(s[0]['id'])); print('OK lokaler Server', s[0]['name'])"
          curl -fsS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8080/api/v1/servers/$(cat local_id)/history?metric=moni_host_memory_usage_percent" > history.json
          python3 -c "import json; n=sum(len(x['points']) for x in json.load(open('history.json'))['series']); assert n>=2, n; print('OK', n, 'Punkte')"
          # Anmeldung: Setup-Token kommt aus dem Log (D9), Dateien statt Pipes in grep -q (R7)
          docker compose -f compose.manager.yaml logs > manager.log
          SETUP_TOKEN=$(grep -oE 'Setup-Token setup_[A-Za-z0-9_-]+' manager.log | head -n1 | cut -d' ' -f2)
          test -n "$SETUP_TOKEN"
          python3 scripts/ci/manager_auth_smoke.py http://127.0.0.1:8080 "$SETUP_TOKEN"
          # P3-R6: der OIDC-code darf nicht in den Zugriffslogs landen (Status egal)
          curl -s -o /dev/null "http://127.0.0.1:8080/api/v1/auth/oidc/callback/x?code=GEHEIMCODE123&state=y" || true
          sleep 2
          # Erst in Dateien schreiben: grep -q in einer Pipe kann unter pipefail per SIGPIPE falsch auswerten
          docker compose -f compose.manager.yaml logs > manager.log
          if grep -qF "$TOKEN" manager.log; then echo "FAIL: Token im Log"; exit 1; fi
          if grep -qF "$MONI_SECRET_KEY" manager.log; then echo "FAIL: MONI_SECRET_KEY im Log"; exit 1; fi
          if grep -qF "ci-smoke-Passwort-2026" manager.log; then echo "FAIL: Admin-Passwort im Log"; exit 1; fi
          if grep -qiF "recovery" manager.log; then echo "FAIL: Wiederherstellungscode im Log"; exit 1; fi
          if grep -qF "GEHEIMCODE123" manager.log; then echo "FAIL: OIDC-code im Log"; exit 1; fi
          test "$(docker inspect --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' $(docker compose -f compose.manager.yaml ps -q moni-manager))" = "app true [ALL]"

      - name: Logs
        if: always()
        run: docker compose -f compose.agent.yaml logs

      - name: Manager logs
        if: always()
        env:
          COMPOSE_PROJECT_NAME: moni-manager
          MONI_SECRET_KEY: ci-platzhalter  # nur damit compose die Datei auflöst
        run: docker compose -f compose.manager.yaml logs

      - name: Cleanup
        if: always()
        run: docker compose -f compose.agent.yaml down -v

      - name: Manager cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: moni-manager
          MONI_SECRET_KEY: ci-platzhalter
        run: docker compose -f compose.manager.yaml down -v
