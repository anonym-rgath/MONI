# CI-Pipeline fuer MONI
# ---------------------
# Validiert jeden Push auf main und jeden Pull Request (inkl. Dependabot):
#   1. Backend-Unit-Tests und Frontend (npm ci, Lint, Typen, Tests, Build).
#   2. Baut beide Image-Targets (agent, manager). Damit laufen `npm run build`
#      und `pip install` durch.
#   3. Startet compose.agent.yaml (Agent + Socket-Proxy) auf dem Runner und
#      (TLS an) und prueft per HTTPS Health, Auth, Snapshot, Metriken und die
#      Container-Haertung.
#   4. Startet compose.manager.yaml (HTTPS) und prueft Health, Admin-Token, lokalen
#      Server mit Verlauf, Geheimnis-freie Logs und die Container-Haertung.
#   5. Koppelt den Agent per mTLS mit dem Manager (beide Netze verbunden).
#   6. Alarmkanal und E2E-Alarm: Agent stoppen löst "Server nicht erreichbar" echt aus (Webhook
#      firing), Agent starten löst ihn (resolved), die Kopplung überlebt den Neustart.
#   7. Lädt die Oberfläche per Playwright im echten Browser (CSP, Tastatur, axe).
# Beide Images werden nach dem Build mit Trivy geprüft (scripts/ci/trivy.sh, CRITICAL/HIGH mit Fix;
# Ausnahmen nur in .trivyignore). Alle Actions sind per Commit-SHA gepinnt, Dependabot hält sie aktuell.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
        working-directory: backend

      - name: Dokumentation pruefen
        run: python3 scripts/ci/check_docs.py

  frontend:
    name: Frontend (Lint, Typen, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build:
    name: Build images & smoke tests
    runs-on: ubuntu-latest
    env:
      # Compose nutzt die lokal gebauten CI-Images und zieht nie von GHCR (D5)
      MONI_AGENT_IMAGE: moni-agent:ci
      MONI_MANAGER_IMAGE: moni-manager:ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Docker-Gruppe des Sockets
        run: echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: agent
          load: true
          tags: moni-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Build manager image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: manager
          load: true
          tags: moni-manager:ci
          cache-from: type=gha,scope=manager
          cache-to: type=gha,mode=max,scope=manager

      - name: Trivy
        run: |
          set -euo pipefail
          scripts/ci/trivy.sh moni-agent:ci
          scripts/ci/trivy.sh moni-manager:ci

      - name: Agent smoke test
        run: |
          set -euo pipefail
          docker compose -f compose.agent.yaml up -d
          ok=0
          for _ in $(seq 1 30); do curl -fsSk https://127.0.0.1:9810/api/v1/health > agent-health.json 2>/dev/null && grep -q '"ok"' agent-health.json && { ok=1; break; }; sleep 1; done
          [ "$ok" = 1 ] || { echo "FAIL: /api/v1/health nicht erreichbar"; exit 1; }
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:9810/api/v1/snapshot)" = 401
          TOKEN=$(docker compose -f compose.agent.yaml exec -T moni-agent python -m moni.cli token create --name ci | tail -n1)
          sleep 20   # mindestens eine Messung abwarten (Takt 15 s)
          curl -fsSk -H "Authorization: Bearer $TOKEN" https://127.0.0.1:9810/api/v1/snapshot > snap.json
          python3 -c "import json; s=json.load(open('snap.json')); assert s['docker']['reachable'], s['warnings']; assert s['host']['filesystems'], 'keine Dateisysteme'; print('OK', len(s['containers']), 'Container')"
          curl -fsSk -H "Authorization: Bearer $TOKEN" https://127.0.0.1:9810/api/v1/info > info.json
          python3 -c "import json; assert json.load(open('info.json'))['paired'] is False, 'unerwartet gekoppelt'"
          # Erst in Dateien schreiben: grep -q in einer Pipe kann unter pipefail per SIGPIPE falsch auswerten
          curl -fsSk -H "Authorization: Bearer $TOKEN" https://127.0.0.1:9810/metrics > metrics.txt
          grep -q '^moni_docker_up 1' metrics.txt
          test "$(docker inspect --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' "$(docker compose -f compose.agent.yaml ps -q moni-agent)")" = "app true [ALL]"
          # Token darf nie im Log stehen (`!` allein würde set -e umgehen)
          docker compose -f compose.agent.yaml logs > smoke.log
          if grep -qF "$TOKEN" smoke.log; then echo "FAIL: Token im Log"; exit 1; fi
          # Der Kopplungscode darf (und muss) im Log stehen, solange der Agent ungekoppelt ist (D2)
          test -n "$(grep -oE 'moni-pair-v1:[A-Za-z0-9_:-]+' smoke.log | head -n1)"

      - name: Socket-Proxy sperrt
        run: |
          set -euo pipefail
          # Aus dem Agent-Container gegen DOCKER_API_BASE: nur Liste, Inspect und Stats erlaubt
          docker compose -f compose.agent.yaml exec -T moni-agent python - <<'PY'
          import json, os, urllib.error, urllib.request
          base = os.environ["DOCKER_API_BASE"]
          def call(method, path):
              req = urllib.request.Request(base + path, method=method, data=b"" if method == "POST" else None)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, b""
          st, body = call("GET", "/containers/json")
          assert st == 200, ("containers/json", st)
          cid = json.loads(body)[0]["Id"]
          want = {
              ("GET", "/containers/json?all=true"): (200,),
              ("GET", f"/containers/{cid}/json"): (200,),
              ("GET", f"/containers/{cid}/stats?stream=false"): (200,),
              ("GET", f"/containers/{cid}/logs?stdout=1"): (403,),
              ("GET", f"/containers/{cid}/archive?path=/"): (403,),
              ("POST", f"/containers/{cid}/stop"): (403, 405),
              ("GET", "/images/json"): (403,),
              ("GET", "/containers/../json"): (403, 404),
              ("GET", "/containers/json/../../images/json"): (403, 404),
          }
          bad = []
          for (m, p), ok in want.items():
              got = call(m, p)[0]
              print(m, p.split("?")[0].replace(cid, "<id>"), got)
              if got not in ok:
                  bad.append((m, p, got))
          assert not bad, bad
          print("OK Socket-Proxy sperrt")
          PY
          # Ein fremder Container im Proxy-Netz (nicht "moni-agent") wird abgewiesen: das Agent-Image dient als Client
          # Netz genau dieses Stacks: das socket-proxy-Netz, an dem der Agent hängt
          PROXY_NET=$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$(docker compose -f compose.agent.yaml ps -q moni-agent)" | tr ' ' '\n' | grep 'socket-proxy$' | head -n1)
          test -n "$PROXY_NET"
          # Nur HTTP 403 gilt als bestanden; Verbindungsfehler, Timeout oder 2xx (Proxy aus, falscher Name) sind FAIL
          docker run --rm -i --network "$PROXY_NET" --entrypoint python moni-agent:ci - <<'PY'
          import urllib.error, urllib.request
          try:
              r = urllib.request.urlopen("http://docker-socket-proxy:2375/containers/json", timeout=10)
          except urllib.error.HTTPError as e:
              if e.code != 403:
                  raise SystemExit(f"FAIL: fremder Client erhielt HTTP {e.code}, erwartet 403")
          else:
              raise SystemExit(f"FAIL: fremder Client erhielt HTTP {r.status}")
          print("OK fremder Client abgewiesen (403)")
          PY
          python3 -c "import json; s=json.load(open('snap.json')); n=sum(c['stats_available'] for c in s['containers']); assert n>0, 'keine Container-Metriken'; print('OK', n, 'Container mit Metriken')"

      - name: Betriebsskripte
        run: scripts/selftest.sh

      - name: Manager smoke test
        env:
          COMPOSE_PROJECT_NAME: moni-manager
          MONI_COLLECT_INTERVAL: "5"  # nur CI: der E2E-Alarm braucht kurze Takte (Ausfall nach 2 x 5 s)
        run: |
          set -euo pipefail
          MONI_SECRET_KEY=$(docker run --rm moni-manager:ci python -m moni.cli secret generate)
          export MONI_SECRET_KEY
          docker compose -f compose.manager.yaml up -d
          ok=0
          for _ in $(seq 1 60); do curl -fsSk https://127.0.0.1:8443/api/v1/health > health.json 2>/dev/null && grep -q '"ok"' health.json && { ok=1; break; }; sleep 1; done
          [ "$ok" = 1 ] || { echo "FAIL: Manager /api/v1/health nicht erreichbar"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 301
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8080/)" = "https://127.0.0.1:8443/"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/api/v1/servers)" = 401
          TOKEN=$(docker compose -f compose.manager.yaml exec -T moni-manager python -m moni.cli token create --name ci --scope admin | tail -n1)
          sleep 15   # mindestens zwei Messungen abwarten (Takt 5 s)
          curl -fsSk -H "Authorization: Bearer $TOKEN" https://127.0.0.1:8443/api/v1/servers > servers.json
          python3 -c "import json; s=[x for x in json.load(open('servers.json')) if x['is_local']]; assert len(s)==1 and s[0]['status']=='ok', s; open('local_id','w').write(str(s[0]['id'])); print('OK lokaler Server', s[0]['name'])"
          curl -fsSk -H "Authorization: Bearer $TOKEN" "https://127.0.0.1:8443/api/v1/servers/$(cat local_id)/history?metric=moni_host_memory_usage_percent" > history.json
          python3 -c "import json; n=sum(len(x['points']) for x in json.load(open('history.json'))['series']); assert n>=2, n; print('OK', n, 'Punkte')"
          # Anmeldung: Setup-Token kommt aus dem Log (D9), Dateien statt Pipes in grep -q (R7)
          docker compose -f compose.manager.yaml logs > manager.log
          SETUP_TOKEN=$(grep -oE 'Setup-Token setup_[A-Za-z0-9_-]+' manager.log | head -n1 | cut -d' ' -f2)
          test -n "$SETUP_TOKEN"
          python3 scripts/ci/manager_auth_smoke.py https://127.0.0.1:8443 "$SETUP_TOKEN" "$RUNNER_TEMP/ci-recovery"
          # P3-R6: der OIDC-code darf nicht in den Zugriffslogs landen (Status egal)
          curl -sk -o /dev/null "https://127.0.0.1:8443/api/v1/auth/oidc/callback/x?code=GEHEIMCODE123&state=y" || true
          sleep 2
          # Erst in Dateien schreiben: grep -q in einer Pipe kann unter pipefail per SIGPIPE falsch auswerten
          docker compose -f compose.manager.yaml logs > manager.log
          if grep -qF "$TOKEN" manager.log; then echo "FAIL: Token im Log"; exit 1; fi
          if grep -qF "$MONI_SECRET_KEY" manager.log; then echo "FAIL: MONI_SECRET_KEY im Log"; exit 1; fi
          if grep -qF "ci-smoke-Passwort-2026" manager.log; then echo "FAIL: Admin-Passwort im Log"; exit 1; fi
          # Auf die echten, noch unbenutzten Wiederherstellungscodes prüfen (nicht auf das Wort)
          test -s "$RUNNER_TEMP/ci-recovery"
          while read -r code; do
            if grep -qF -- "$code" manager.log; then echo "FAIL: Wiederherstellungscode im Log"; exit 1; fi
          done < "$RUNNER_TEMP/ci-recovery"
          if grep -qF "GEHEIMCODE123" manager.log; then echo "FAIL: OIDC-code im Log"; exit 1; fi
          test "$(docker inspect --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}}' "$(docker compose -f compose.manager.yaml ps -q moni-manager)")" = "app true [ALL]"

      - name: Kopplung (mTLS)
        run: |
          set -euo pipefail
          agent() { docker compose -f compose.agent.yaml "$@"; }
          manager() { MONI_SECRET_KEY=ci-platzhalter COMPOSE_PROJECT_NAME=moni-manager docker compose -f compose.manager.yaml "$@"; }
          # Agent-Stack (Standardprojekt) und Manager-Stack laufen noch; Manager ans Agent-Netz hängen
          AGENT_CID=$(agent ps -q moni-agent)
          MANAGER_CID=$(manager ps -q moni-manager)
          AGENT_NET=$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$AGENT_CID" | tr ' ' '\n' | grep -v socket-proxy | head -n1)
          docker network connect "$AGENT_NET" "$MANAGER_CID"
          # Erst in Dateien schreiben (R7); der Code steht nur, solange der Agent ungekoppelt ist
          agent logs moni-agent > agent.log
          CODE=$(grep -oE 'moni-pair-v1:[A-Za-z0-9_:-]+' agent.log | head -n1)
          test -n "$CODE"
          python3 scripts/ci/pair_smoke.py https://127.0.0.1:8443 "$CODE" https://moni-agent:9810 "$RUNNER_TEMP/ci-recovery"
          sleep 5
          agent logs moni-agent > agent.log
          grep -qF "Agent gekoppelt" agent.log
          # Das Kopplungs-Token wird nach der Kopplung nicht erneut geloggt (Zeilen nach "Agent gekoppelt")
          awk '/Agent gekoppelt/{f=1} f' agent.log > after-pairing.log
          if grep -qF "moni-pair-v1:" after-pairing.log; then echo "FAIL: Kopplungscode nach der Kopplung im Log"; exit 1; fi
          # Auch nach einem Neustart des gekoppelten Agents wird der Code nicht erneut geloggt (nur neue Logzeilen prüfen)
          LINES_BEFORE=$(wc -l < agent.log)
          agent restart moni-agent
          ok=0
          for _ in $(seq 1 30); do curl -fsSk https://127.0.0.1:9810/api/v1/health > agent-health.json 2>/dev/null && grep -q '"ok"' agent-health.json && { ok=1; break; }; sleep 1; done
          [ "$ok" = 1 ] || { echo "FAIL: Agent nach Neustart nicht erreichbar"; exit 1; }
          agent logs moni-agent > agent.log
          tail -n +"$((LINES_BEFORE + 1))" agent.log > after-restart.log
          test -s after-restart.log
          if grep -qF "moni-pair-v1:" after-restart.log; then echo "FAIL: Kopplungscode nach dem Neustart im Log"; exit 1; fi
          # Das Kopplungs-Token (3. Feld des Codes) darf auch im Manager-Log nicht stehen
          PAIR_TOKEN=$(echo "$CODE" | cut -d: -f3)
          test -n "$PAIR_TOKEN"
          manager logs > manager.log
          if grep -qF "$PAIR_TOKEN" manager.log; then echo "FAIL: Kopplungs-Token im Manager-Log"; exit 1; fi
          # Bearer-Token für Fremdsysteme funktioniert weiter, Prüfung gegen die Manager-CA
          curl -fsSk https://127.0.0.1:8443/api/v1/ca.crt > ca.crt
          TOKEN=$(agent exec -T moni-agent python -m moni.cli token create --name ci-ext | tail -n1)
          curl -fsS --cacert ca.crt --resolve moni-agent:9810:127.0.0.1 -H "Authorization: Bearer $TOKEN" https://moni-agent:9810/api/v1/snapshot > snap2.json
          curl -fsS --cacert ca.crt --resolve moni-agent:9810:127.0.0.1 -H "Authorization: Bearer $TOKEN" https://moni-agent:9810/api/v1/info > info2.json
          python3 -c "import json; json.load(open('snap2.json'))['host']; assert json.load(open('info2.json'))['paired'] is True; print('OK Fremdsystem-Token nach Kopplung')"

      - name: Alarmkanal
        run: |
          set -euo pipefail
          manager() { MONI_SECRET_KEY=ci-platzhalter COMPOSE_PROJECT_NAME=moni-manager docker compose -f compose.manager.yaml "$@"; }
          # Runner-Adresse aus Sicht des Managers = Gateway seines Compose-Netzes; der Empfänger bindet nur dort, nie 0.0.0.0
          HOOK_HOST=$(docker network inspect moni-manager_default -f '{{(index .IPAM.Config 0).Gateway}}')
          test -n "$HOOK_HOST"
          export HOOK_HOST
          python3 scripts/ci/alert_smoke.py --selftest
          python3 scripts/ci/alert_smoke.py https://127.0.0.1:8443 "$RUNNER_TEMP/ci-recovery" 9911
          # Erst in eine Datei schreiben (R7); das HMAC-Secret darf nie im Log stehen
          manager logs > manager.log
          if grep -qF "ci-hmac-geheim-5f2c" manager.log; then echo "FAIL: HMAC-Secret im Manager-Log"; exit 1; fi

      - name: E2E Alarm
        run: |
          set -euo pipefail
          # Manager-Stack läuft mit Takt 5 s (Schritt "Manager smoke test"); HOOK_HOST wie im Schritt "Alarmkanal"
          HOOK_HOST=$(docker network inspect moni-manager_default -f '{{(index .IPAM.Config 0).Gateway}}')
          test -n "$HOOK_HOST"
          export HOOK_HOST
          python3 scripts/ci/e2e_alert.py --selftest
          python3 scripts/ci/e2e_alert.py https://127.0.0.1:8443 "$RUNNER_TEMP/ci-recovery" 9912 ci-agent \
            --stop-cmd "docker compose -f compose.agent.yaml stop moni-agent" \
            --start-cmd "docker compose -f compose.agent.yaml start moni-agent"
          MONI_SECRET_KEY=ci-platzhalter COMPOSE_PROJECT_NAME=moni-manager docker compose -f compose.manager.yaml logs > manager.log
          if grep -qF "ci-hmac-geheim-5f2c" manager.log; then echo "FAIL: HMAC-Secret im Manager-Log"; exit 1; fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"

      - name: Oberfläche im Browser
        run: |
          set -euo pipefail
          manager() { MONI_SECRET_KEY=ci-platzhalter COMPOSE_PROJECT_NAME=moni-manager docker compose -f compose.manager.yaml "$@"; }
          # Zugangsdaten nur über Umgebungsvariablen, vorher maskieren; nie ausgeben
          MONI_EMAIL=$(python3 -c "import sys; sys.path.insert(0,'scripts/ci'); import _moni; print(_moni.EMAIL)")
          MONI_PASSWORD=$(python3 -c "import sys; sys.path.insert(0,'scripts/ci'); import _moni; print(_moni.PASSWORD)")
          MONI_RECOVERY=$(python3 -c "import sys; sys.path.insert(0,'scripts/ci'); import _moni; print(_moni.take_recovery('$RUNNER_TEMP/ci-recovery'))")
          echo "::add-mask::$MONI_PASSWORD"
          echo "::add-mask::$MONI_RECOVERY"
          export MONI_EMAIL MONI_PASSWORD MONI_RECOVERY
          cd frontend
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          # Ausgabe zuerst in eine Datei (R7), dann ausgeben; Fehler des Tests bleiben maßgeblich
          rc=0
          npm run test:e2e > "$RUNNER_TEMP/e2e.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/e2e.log"
          [ "$rc" = 0 ] || exit "$rc"
          cd ..
          manager logs > manager.log
          if grep -qF "$MONI_PASSWORD" manager.log; then echo "FAIL: Passwort im Manager-Log"; exit 1; fi
          if grep -qF "$MONI_RECOVERY" manager.log; then echo "FAIL: Wiederherstellungscode im Manager-Log"; exit 1; fi

      - name: Logs
        if: always()
        run: docker compose -f compose.agent.yaml logs

      - name: Manager logs
        if: always()
        env:
          COMPOSE_PROJECT_NAME: moni-manager
          MONI_SECRET_KEY: ci-platzhalter  # nur damit compose die Datei auflöst
        run: docker compose -f compose.manager.yaml logs

      - name: Cleanup
        if: always()
        run: docker compose -f compose.agent.yaml down -v

      - name: Manager cleanup
        if: always()
        env:
          COMPOSE_PROJECT_NAME: moni-manager
          MONI_SECRET_KEY: ci-platzhalter
        run: docker compose -f compose.manager.yaml down -v
