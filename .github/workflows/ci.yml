# CI-Pipeline fuer MONI
# ---------------------
# Validiert jeden Push auf main und jeden Pull Request (inkl. Dependabot):
#   1. Baut das vollstaendige Multi-stage-Image. Damit laufen automatisch
#      `yarn build` (inkl. ESLint via CRACO) und `pip install` durch -
#      Build-Fehler in Frontend- oder Backend-Dependencies fallen hier auf.
#   2. Startet den Container und prueft, ob die API antwortet (Boot-Smoke).
#
# Die vollstaendige Runtime-Haertung (read_only, cap_drop, Docker-Socket-Proxy)
# wird weiterhin auf dem Ziel-Host per scripts/smoke.sh verifiziert - sie braucht das
# externe traefik-network und die Host-Mounts, die im CI-Runner fehlen.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
        working-directory: backend

  build:
    name: Build image & boot smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: linux-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot smoke test
        run: |
          docker run -d --name linux-monitor-ci -p 8080:80 linux-monitor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/ | grep -q '"status":"live"'; then
              echo "OK: API antwortet mit status=live"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: API hat nach 30s nicht mit status=live geantwortet"
          docker logs linux-monitor-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f linux-monitor-ci || true
