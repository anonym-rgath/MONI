# Dependabot-Konfiguration für MONI
# ----------------------------------
# Fünf Update-Streams: Python-Backend, NPM-Frontend, Docker-Base-Images, GitHub Actions
# (per Commit-SHA gepinnt) und Images der Compose-Dateien.
# Wochenrhythmus (sammelt PRs in einem Schwung), Major-Updates gruppiert,
# Patches und Minor jeweils einzeln. Security-Updates laufen unabhängig
# vom Schedule sofort, sobald ein bekannter Fix verfügbar ist.
#
# Auto-Merge bewusst NICHT eingerichtet. Jeder PR braucht manuelles Review,
# damit Breaking-Changes nicht unbemerkt durchrutschen.

version: 2
updates:

  # --- Backend: Python (pip) ----------------------------------------------
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    groups:
      backend-major:
        update-types:
          - "major"

  # --- Frontend: npm -------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(frontend)"
      include: "scope"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"
      frontend-major:
        update-types:
          - "major"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"

  # --- Docker: Root Dockerfile -------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"

  # --- GitHub Actions: Workflows (per Commit-SHA gepinnt) ---------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(ci)"

  # --- Docker Compose: Images in den compose-Dateien -----------------------
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(compose)"
