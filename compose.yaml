services:
  linux-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linux-monitor
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    networks:
      # Zentraler docker-socket-proxy lebt in PI-SETUP und stellt das
      # socket-proxy-network bereit (external, internal: true).
      - socket-proxy-network
      - traefik-network
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linux-monitor.rule=Host(`${MONITOR_HOST:?MONITOR_HOST muss in .env gesetzt sein}`)"
      - "traefik.http.routers.linux-monitor.entrypoints=${TRAEFIK_ENTRYPOINT:?TRAEFIK_ENTRYPOINT muss in .env gesetzt sein}"
      - "traefik.http.routers.linux-monitor.priority=100"
      - "traefik.http.services.linux-monitor.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-network"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/hostname:/host/etc/hostname:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - DOCKER_API_BASE=http://docker-socket-proxy:2375
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-}
      - DOCKER_STATS_TIMEOUT=${DOCKER_STATS_TIMEOUT:-2.5}
      - DOCKER_INSPECT_TIMEOUT=${DOCKER_INSPECT_TIMEOUT:-1.0}
      - MAX_DOCKER_WORKERS=${MAX_DOCKER_WORKERS:-8}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  socket-proxy-network:
    external: true
  traefik-network:
    external: true
