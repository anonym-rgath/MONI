services:
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476}
    container_name: docker-socket-proxy
    restart: unless-stopped
    networks:
      - monitor-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0
    security_opt:
      - no-new-privileges:true

  pi-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi-monitor
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    depends_on:
      - docker-socket-proxy
    networks:
      - monitor-internal
      - traefik-network
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pi-monitor.rule=Host(`${MONITOR_HOST:?MONITOR_HOST muss in .env gesetzt sein}`)"
      - "traefik.http.routers.pi-monitor.entrypoints=${TRAEFIK_ENTRYPOINT:?TRAEFIK_ENTRYPOINT muss in .env gesetzt sein}"
      - "traefik.http.routers.pi-monitor.priority=100"
      - "traefik.http.services.pi-monitor.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-network"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/hostname:/host/etc/hostname:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - DOCKER_API_BASE=http://docker-socket-proxy:2375
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-}
      - DOCKER_STATS_TIMEOUT=${DOCKER_STATS_TIMEOUT:-2.5}
      - DOCKER_INSPECT_TIMEOUT=${DOCKER_INSPECT_TIMEOUT:-1.0}
      - MAX_DOCKER_WORKERS=${MAX_DOCKER_WORKERS:-8}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  monitor-internal:
    internal: true
  traefik-network:
    external: true
