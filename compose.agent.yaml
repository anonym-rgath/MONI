services:
  moni-agent:
    image: ${MONI_AGENT_IMAGE:-ghcr.io/anonym-rgath/moni-agent:2.0.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /etc/hostname:/host/etc/hostname:ro
      - moni-agent-data:/data
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_ROOT=/host/root
      - DOCKER_API_BASE=http://docker-socket-proxy:2375
      - MONI_TLS=${MONI_TLS:-on}
      - MONI_PUBLIC_URL=${MONI_PUBLIC_URL:-}
      - MONI_TRUSTED_PROXIES=${MONI_TRUSTED_PROXIES:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Standardmäßig nur localhost (sicherer). Für die mTLS-Anbindung durch den Manager: MONI_AGENT_BIND=0.0.0.0 (siehe .env.example).
    ports:
      - "${MONI_AGENT_BIND:-127.0.0.1}:9810:9810"
    networks:
      - default
      - socket-proxy

  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    restart: unless-stopped
    # Allowlist statt Bereichsfreigabe (D4): nur Liste, Inspect und Stats von Containern; kein logs/archive/exec, keine anderen Methoden.
    # Nur der Moni-Dienst darf verbinden. Die Gruppe muss die Docker-Socket-Gruppe sein: DOCKER_GID=$(stat -c %g /var/run/docker.sock)
    user: "65534:${DOCKER_GID:-999}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - '-listenip=0.0.0.0'
      - '-allowfrom=moni-agent'
      - '-allowGET=/(v[0-9.]+/)?containers/(json|[a-zA-Z0-9_.-]+/(json|stats))'
      - '-allowhealthcheck'
      - '-watchdoginterval=60'
      - '-stoponwatchdog'
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

networks:
  socket-proxy:
    internal: true

volumes:
  moni-agent-data:
