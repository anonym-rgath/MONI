services:
  moni-agent:
    build:
      context: .
      target: agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /etc/hostname:/host/etc/hostname:ro
      - moni-agent-data:/data
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_ROOT=/host/root
      - DOCKER_API_BASE=http://docker-socket-proxy:2375
      - MONI_TLS=off
    # Nur localhost, solange es kein TLS gibt.
    ports:
      - "${MONI_AGENT_BIND:-127.0.0.1}:9810:9810"
    networks:
      - default
      - socket-proxy

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - socket-proxy

networks:
  socket-proxy:
    internal: true

volumes:
  moni-agent-data:
